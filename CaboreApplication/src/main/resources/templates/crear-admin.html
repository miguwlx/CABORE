<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear administrador — Caboré</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --gold: #b8923c;
    --gold-dk: #8c6c28;
    --dark: #faf7f0;
    --surface: #ffffff;
    --light: #1c1810;
    --muted: rgba(28,24,16,0.58);
    --border: rgba(184,146,60,0.28);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--light);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:24px;padding:40px 36px;width:100%;max-width:420px;
    box-shadow:0 24px 60px rgba(28,24,16,0.10);
}
.back{display:inline-block;font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:16px;}
.back:hover{color:var(--gold-dk);}
h2{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px;}
p.sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;margin-top:16px;}
input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--dark);color:var(--light);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;
}
input:focus{border-color:var(--gold);background:#fff;}
button,.btn-link{
    width:100%;margin-top:22px;padding:13px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dk));color:#fff;
    font-weight:700;font-size:14px;cursor:pointer;display:inline-block;text-align:center;text-decoration:none;
}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5;}
.msg-ok{background:rgba(15,157,99,0.10);border:1px solid rgba(15,157,99,0.28);color:#0c7a4d;}
.msg-err{background:rgba(220,38,38,0.10);border:1px solid rgba(220,38,38,0.25);color:#b91c1c;}
</style>
</head>
<body>
<div class="card">
    <a th:href="@{/login}" class="back">← Volver a iniciar sesión</a>
    <h2>🛡️ Crear administrador</h2>
    <p class="sub">Instalación controlada · Caboré</p>

    <div th:if="${mensaje}" class="msg" th:classappend="${exito ? 'msg-ok' : 'msg-err'}" th:text="${mensaje}"></div>

    <form th:if="${!exito}" th:action="@{/crear-admin}" method="POST">
        <label for="clave_instalacion">Clave de instalación</label>
        <input type="password" id="clave_instalacion" name="clave_instalacion" required autocomplete="off">

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>

        <label for="contrasena">Contraseña (mín. 8 caracteres)</label>
        <input type="password" id="contrasena" name="contrasena" required minlength="8" autocomplete="new-password">

        <button type="submit">Crear cuenta de administrador →</button>
    </form>

    <a th:if="${exito}" th:href="@{/login}" class="btn-link">Ir a iniciar sesión →</a>
</div>
</body>
</html>
