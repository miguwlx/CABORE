# ============================================================
# CABORE - Perfil PRODUCCIÓN
# TODAS las credenciales deben venir de variables de entorno.
# No hay valores por defecto a propósito: si falta alguna
# (DB_HOST, DB_NAME, DB_USERNAME, DB_PASSWORD) la aplicación
# NO arranca, en lugar de conectarse con datos inseguros.
# ============================================================

# --- Conexión a MariaDB ---
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- Pool de conexiones ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=20000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# --- Thymeleaf con caché ---
spring.thymeleaf.cache=true

# --- Logging sobrio ---
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# --- FASE 3 (cliente): crea si falta la tabla del carrito persistente ---
# Script idempotente (CREATE TABLE IF NOT EXISTS); ver db/fase3-carrito.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/fase3-carrito.sql
