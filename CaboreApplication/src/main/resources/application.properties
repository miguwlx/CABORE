# ============================================================
# CABORE - Configuración COMÚN a todos los entornos
# No poner aquí credenciales, URLs de BD ni secretos.
# Cada entorno vive en su propio archivo:
#   application-dev.properties   -> desarrollo local (por defecto)
#   application-prod.properties  -> producción
#   src/test/resources/application-test.properties -> pruebas
# ============================================================
spring.application.name=CaboreApplication

# Perfil por defecto: dev. Para producción: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Carga opcional de un archivo .env local (formato CLAVE=valor, ignorado por git).
# Si no existe, se ignora. Las variables de entorno del sistema tienen prioridad.
spring.config.import=optional:file:.env[.properties]

# Puerto HTTP del servidor (variable de entorno SERVER_PORT)
server.port=${SERVER_PORT:8080}

# Nunca exponer detalles internos en las páginas de error
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Correo SMTP (Recuperación de contraseña) ---
# Se configura mediante variables de entorno en .env (ver .env.example)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
cabore.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@cabore.co}}
cabore.app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- Google Sign-In (Client ID de OAuth2) ---
cabore.google.client-id=${GOOGLE_CLIENT_ID:853981485167-vsbi9h44ktc32d6c6ppipnls9fc6iqh7.apps.googleusercontent.com}

# --- Clave de instalación para /crear-admin (crear_admin.php) ---
cabore.admin.setup-key=${ADMIN_SETUP_KEY:}
