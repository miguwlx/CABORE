# ============================================================
# CABORE - Perfil DESARROLLO (MariaDB local, p. ej. XAMPP)
# Los valores se leen de variables de entorno o del archivo .env
# (ver .env.example). NO escribir contraseñas en este archivo.
# ============================================================

# --- Conexión a MariaDB ---
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cabore_restaurada}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA / Hibernate ---
# El esquema lo gestiona cabore.sql; Hibernate NO debe modificarlo.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Sin hibernate.dialect: Hibernate 7 detecta MariaDB automáticamente.

# --- Thymeleaf: sin caché para ver cambios al instante ---
spring.thymeleaf.cache=false

# --- Logging más detallado solo en desarrollo ---
logging.level.co.cabore=DEBUG

# --- Inicialización idempotente de tablas adicionales (CREATE TABLE IF NOT EXISTS) ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/fase3-carrito.sql,classpath:db/tienda-personalizacion.sql
