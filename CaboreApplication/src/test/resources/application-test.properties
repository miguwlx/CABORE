# ============================================================
# CABORE - Perfil TEST
# Base de datos H2 en memoria (modo MariaDB). Las pruebas NUNCA
# tocan la base de datos de desarrollo ni la de producción.
# Se activa con @ActiveProfiles("test") en las clases de prueba.
# ============================================================
spring.datasource.url=jdbc:h2:mem:cabore_test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# El esquema se crea y destruye automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.port=0

# --- Pruebas: H2 crea el esquema desde entidades; no ejecutar el DDL ---
spring.sql.init.mode=never
