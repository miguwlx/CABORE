<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caboré — Recuperar contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/recuperacion.css">
</head>
<body>

<div class="noise"></div>
<div class="bg-glow a"></div>
<div class="bg-glow b"></div>

<div class="recover-card">
  <a href="login.html" class="recover-back">← Volver a iniciar sesión</a>

  <div class="recover-icon">🔑</div>
  <div class="recover-eyebrow">Recuperación de cuenta</div>
  <div class="recover-title">¿Olvidaste tu <em>contraseña?</em></div>
  <p class="recover-sub">Tranquilo, le pasa a todos. Ingresa tu correo y te enviaremos un enlace para crear una nueva.</p>

  <form action="enviar_recuperacion.php" method="POST" id="olvideForm">
    <div class="field">
      <label class="field-label" for="correo">Correo electrónico</label>
      <div class="field-wrap">
        <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required autocomplete="email">
      </div>
    </div>
    <button type="submit" class="btn-gold">Enviar enlace de recuperación →</button>
  </form>

  <div class="recover-footer">
    ¿Recordaste tu contraseña? <a href="login.html">Inicia sesión</a>
  </div>
</div>

<script src="js/validaciones.js"></script>
</body>
</html>
