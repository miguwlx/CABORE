<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caboré — Recuperar contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="page" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div class="panel-area" style="max-width:420px">
    <div class="panel-title">¿Olvidaste tu contraseña?</div>
    <p class="panel-sub">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>

    <form action="enviar_recuperacion.php" method="POST" id="olvideForm">
      <div class="field">
        <label class="field-label" for="correo">Correo electrónico</label>
        <div class="field-wrap focus-blue">
          <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required autocomplete="email">
        </div>
      </div>
      <button type="submit" class="btn-submit btn--blue">Enviar enlace de recuperación</button>
    </form>

    <div class="panel-footer" style="margin-top:20px">
      <a href="login.html">← Volver a iniciar sesión</a>
    </div>
  </div>
</div>

<script src="js/validaciones.js"></script>
</body>
</html>
